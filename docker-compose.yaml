services:
  api:
    build:
      context: .
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      
      # MongoDB Configuration
      - MongoDb__ConnectionString=mongodb://mongo:27017/gtmotive-estimate
      - MongoDb__MongoDbDatabaseName=gtmotive-estimate
      
      # Azure Service Bus Emulator Configuration
      - Bus__Provider=Azure
      - Bus__ConnectionString=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      - Bus__DefaultQueueOrTopicName=gtmotive-events
      
      # JWT Bearer Authentication (Local Dev)
      - Jwt__Secret=replace-with-a-long-random-development-secret
      - Jwt__Issuer=gtmotive-estimate-api
      - Jwt__Audience=gtmotive-estimate-clients
    depends_on:
      - mongo
      - servicebus-emulator
    networks:
      - gtmotive-network

  mongo:
    image: mongo:7.0
    container_name: gtmotive-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gtmotive-estimate
    volumes:
      - mongo-data:/data/db
    networks:
      - gtmotive-network

  # --- Azure Service Bus Emulator Services ---
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: servicebus-emulator
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    depends_on:
      - sqledge
    ports:
      - "5672:5672"
    networks:
      - gtmotive-network
    configs:
      - source: sb_config
        target: /ServiceBus_Emulator/ConfigFiles/Config.json

  sqledge:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqledge
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    networks:
      - gtmotive-network

volumes:
  mongo-data:

networks:
  gtmotive-network:
    driver: bridge

# Inline configuration for the Service Bus Emulator
configs:
  sb_config:
    content: |
      {
        "UserConfig": {
          "Namespaces": [
            {
              "Name": "localhost",
              "Queues": [
                { "Name": "gtmotive-events", "Properties": {} }
              ],
              "Topics": []
            }
          ],
          "Logging": {
            "Type": "Console"
          }
        }
      }