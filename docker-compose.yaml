services:
  api:
    build:
      context: .
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDb__ConnectionString=mongodb://mongo:27017/gtmotive-estimate
      - MongoDb__MongoDbDatabaseName=gtmotive-estimate
      - Bus__Provider=InMemory
    depends_on:
      - mongo
    networks:
      - gtmotive-network

  mongo:
    image: mongo:7.0
    container_name: gtmotive-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gtmotive-estimate
    volumes:
      - mongo-data:/data/db
    networks:
      - gtmotive-network

volumes:
  mongo-data:

networks:
  gtmotive-network:
    driver: bridge